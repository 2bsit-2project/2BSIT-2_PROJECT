<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Create your Hope, Inc. ERP account." />
    <title>Create your account | Hope, Inc. ERP</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #182743;
        --muted: #78869a;
        --blue: #315ff4;
        --blue-dark: #244fe0;
        --border: #dce4ef;
        --success: #087c53;
        --error: #b42318;

    <title>Register User</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7fb;
        --panel: #ffffff;
        --primary: #2f6fed;
        --primary-dark: #1a4ec2;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #d9e1ef;
        --success: #0a8f5b;

      }

      * { box-sizing: border-box; }

      body {

        display: grid;
        min-width: 320px;
        min-height: 100vh;
        place-items: center;
        margin: 0;
        padding: 28px 16px;
        background: #b5c1d0;
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
      }

      .card {
        position: relative;
        width: min(100%, 480px);
        border: 1px solid rgba(226, 232, 240, 0.9);
        border-radius: 17px;
        padding: 28px 30px 26px;
        background: #fff;
        box-shadow: 0 18px 48px rgba(34, 50, 73, 0.13);
      }

      .close-link {
        position: absolute;
        top: 17px;
        right: 17px;
        display: grid;
        width: 26px;
        height: 26px;
        place-items: center;
        border-radius: 50%;
        background: #f3f5f8;
        color: #78869a;
        font-size: 1rem;
        line-height: 1;
        text-decoration: none;
      }

      .close-link:hover { background: #e8edf4; color: var(--ink); }
      .close-link:focus-visible, input:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid rgba(49, 95, 244, 0.25); outline-offset: 2px; }

      h1 { margin: 0; font-size: 1.38rem; letter-spacing: -0.035em; }
      .subtitle { margin: 7px 0 20px; color: var(--muted); font-size: 0.88rem; }

      .notice {
        margin: 0 0 20px;
        border: 1px solid #f5df9e;
        border-radius: 11px;
        padding: 13px 14px;
        background: #fffbed;
        color: #8a6421;
        font-size: 0.78rem;
        line-height: 1.55;
      }

      .notice strong { color: #674b17; }
      form { display: grid; gap: 15px; }

      .name-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      label { display: grid; min-width: 0; gap: 7px; color: #263650; font-size: 0.78rem; font-weight: 600; }

      input {
        width: 100%;
        min-height: 43px;
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 10px 12px;
        background: #fff;
        color: var(--ink);
        font: inherit;
        font-size: 0.84rem;
        font-weight: 400;
      }

      input::placeholder { color: #9aa5b5; }
      input:focus { border-color: #6d8bff; outline: 3px solid rgba(49, 95, 244, 0.1); }

      .password-hint { margin: -8px 0 0; color: var(--muted); font-size: 0.73rem; }

      button {
        min-height: 45px;
        border: 0;
        border-radius: 9px;
        padding: 11px 16px;
        background: var(--blue);
        box-shadow: 0 5px 12px rgba(49, 95, 244, 0.2);
        color: #fff;
        font: inherit;
        font-size: 0.86rem;
        font-weight: 700;
        cursor: pointer;
        transition: background 150ms ease, transform 150ms ease;
      }

      button:hover { transform: translateY(-1px); background: var(--blue-dark); }
      button:disabled { cursor: wait; opacity: 0.7; transform: none; }

      .status {
        display: none;
        margin-top: 15px;
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 0.8rem;
        font-weight: 600;
        line-height: 1.5;
      }

      .status.success { display: block; background: #eaf8f1; color: var(--success); }
      .status.error { display: block; background: #fff0ef; color: var(--error); }

      .footer { margin: 20px 0 0; color: var(--muted); font-size: 0.79rem; text-align: center; }
      .footer a { color: var(--blue); font-weight: 600; text-decoration: none; }
      .footer a:hover { text-decoration: underline; }
      [hidden] { display: none !important; }

      @media (max-width: 420px) {
        .card { padding: 25px 20px 22px; }
        .name-row { gap: 9px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { transition-duration: 0.01ms !important; }

        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #eef4ff, #f9fbff);
        font-family: Arial, sans-serif;
        color: var(--text);
      }

      .card {
        width: min(100%, 480px);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 14px 38px rgba(31, 41, 55, 0.08);
        padding: 32px;
      }

      h1 {
        margin-top: 0;
        margin-bottom: 8px;
        font-size: 2rem;
      }

      p {
        margin-top: 0;
        color: var(--muted);
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      label {
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-weight: 600;
      }

      input {
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        font-size: 1rem;
      }

      input:focus {
        outline: 2px solid rgba(47, 111, 237, 0.14);
        border-color: var(--primary);
      }

      button {
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 10px;
        padding: 12px 16px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: background 150ms ease;
      }

      button:hover {
        background: var(--primary-dark);
      }

      .status {
        display: none;
        margin-top: 16px;
        padding: 10px 12px;
        border-radius: 8px;
        font-weight: 600;
      }

      .status.success {
        display: block;
        background: rgba(10, 143, 91, 0.08);
        color: var(--success);
      }

      .status.error {
        display: block;
        background: rgba(220, 38, 38, 0.08);
        color: #b91c1c;

      }
    </style>
  </head>
  <body>
    <main class="card">

      <a class="close-link" href="/" aria-label="Close registration and return home">×</a>
      <h1>Create your account</h1>
      <p class="subtitle">Join Hope, Inc. ERP</p>

      <p class="notice">
        New accounts are created as <strong>User</strong>. <strong>Superadmin</strong> and
        <strong>Admin</strong> roles can only be assigned by existing administrators.
      </p>

      <form id="registerForm">
        <div class="name-row">
          <label>
            First name
            <input type="text" name="firstName" autocomplete="given-name" placeholder="Jane" required />
          </label>
          <label>
            Last name
            <input type="text" name="lastName" autocomplete="family-name" placeholder="Doe" required />
          </label>
        </div>

        <label>
          Email address
          <input type="email" name="email" autocomplete="email" placeholder="jane@example.com" required />

      <h1>Register</h1>
      <p>Create a new account. New users are automatically set to <strong>pending</strong>.</p>
      <p>Already have an account? <a href="/login">Log in</a>.</p>

      <form id="registerForm">
        <label>
          Full name
          <input type="text" name="name" placeholder="Jane Doe" required />
        </label>

        <label>
          Email
          <input type="email" name="email" placeholder="jane@example.com" required />

        </label>

        <label>
          Password

          <input type="password" name="password" autocomplete="new-password" minlength="8" placeholder="Create a password" required />
        </label>
        <p class="password-hint">Use at least 8 characters.</p>

        <button id="submitButton" type="submit">Register</button>
      </form>

      <div id="formStatus" class="status" role="status" aria-live="polite"></div>
      <p class="footer">Already have an account? <a href="/login">Sign In</a></p>

          <input type="password" name="password" placeholder="Enter password" required />
        </label>

        <button type="submit">Create account</button>
      </form>

      <div id="formStatus" class="status" aria-live="polite"></div>

    </main>

    <script>
      const form = document.getElementById('registerForm');

      const submitButton = document.getElementById('submitButton');

      const statusBox = document.getElementById('formStatus');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const formData = new FormData(form);

        const firstName = String(formData.get('firstName') || '').trim();
        const lastName = String(formData.get('lastName') || '').trim();
        const payload = {
          name: [firstName, lastName].filter(Boolean).join(' '),
          email: String(formData.get('email') || '').trim(),
          password: String(formData.get('password') || '')
        };

        statusBox.className = 'status';
        statusBox.textContent = '';
        submitButton.disabled = true;

        const payload = Object.fromEntries(formData.entries());

        statusBox.className = 'status';
        statusBox.textContent = '';


        try {
          const response = await fetch('/api/users', {
            method: 'POST',

            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
          });


          const result = await response.json();

          if (!response.ok) {
            throw new Error(result.message || 'Unable to create account.');
          }

          statusBox.classList.add('success');

          statusBox.textContent = `${result.message} Your account is ${result.user.status} and must be approved before you can sign in.`;
          form.reset();
        } catch (error) {
          statusBox.classList.add('error');
          statusBox.textContent = error.message || 'Unable to create account.';
        } finally {
          submitButton.disabled = false;

          statusBox.textContent = `${result.message} Status: ${result.user.status}.`;
          form.reset();
        } catch (error) {
          statusBox.classList.add('error');
          statusBox.textContent = error.message;

        }
      });
    </script>
  </body>
</html>
