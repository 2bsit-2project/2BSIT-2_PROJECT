<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>Choose a new password</title>
    <style>
      :root {
        color-scheme: light;
        --panel: #ffffff;
        --primary: #2f6fed;
        --primary-dark: #1a4ec2;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #d9e1ef;
        --success: #0a8f5b;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #eef4ff, #f9fbff);
        font-family: Arial, sans-serif;
        color: var(--text);
      }
      .card {
        width: min(100%, 480px);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 14px 38px rgba(31, 41, 55, 0.08);
        padding: 32px;
      }
      h1 { margin-top: 0; margin-bottom: 8px; font-size: 2rem; }
      p { margin-top: 0; color: var(--muted); }
      form { display: flex; flex-direction: column; gap: 16px; }
      label { display: flex; flex-direction: column; gap: 8px; font-weight: 600; }
      input { padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 1rem; }
      input:focus { outline: 2px solid rgba(47, 111, 237, 0.14); border-color: var(--primary); }
      button {
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 10px;
        padding: 12px 16px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover { background: var(--primary-dark); }
      .status { display: none; margin-top: 16px; padding: 10px 12px; border-radius: 8px; font-weight: 600; }
      .status.success { display: block; background: rgba(10, 143, 91, 0.08); color: var(--success); }
      .status.error { display: block; background: rgba(220, 38, 38, 0.08); color: #b91c1c; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Choose a new password</h1>
      <p>Reset links expire after one hour and can only be used once.</p>
      <form id="resetForm">
        <label>
          New password
          <input type="password" name="password" autocomplete="new-password" minlength="8" required />
        </label>
        <label>
          Confirm password
          <input type="password" name="confirmPassword" autocomplete="new-password" minlength="8" required />
        </label>
        <button type="submit">Reset password</button>
      </form>
      <div id="formStatus" class="status" aria-live="polite"></div>
      <p><a href="/login">Back to login</a></p>
    </main>
    <script>
      const form = document.getElementById('resetForm');
      const statusBox = document.getElementById('formStatus');
      const token = new URLSearchParams(window.location.search).get('token') || '';

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        statusBox.className = 'status';
        statusBox.textContent = '';

        const formData = new FormData(form);
        const password = formData.get('password');
        if (password !== formData.get('confirmPassword')) {
          statusBox.className = 'status error';
          statusBox.textContent = 'Passwords do not match.';
          return;
        }

        try {
          const response = await fetch('/api/auth/password-reset/confirm', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, password })
          });
          const result = await response.json();
          if (!response.ok) {
            throw new Error(result.message || 'Unable to reset password.');
          }
          statusBox.className = 'status success';
          statusBox.textContent = result.message;
          form.reset();
        } catch (error) {
          statusBox.className = 'status error';
          statusBox.textContent = error.message;
        }
      });
    </script>
  </body>
</html>
