<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | InfoMan</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f7fc;
        --panel: #ffffff;
        --primary: #2f6fed;
        --primary-dark: #1a4ec2;
        --text: #1f2937;
        --muted: #64748b;
        --border: #dce4ef;
        --danger: #b42318;
      }

      * { box-sizing: border-box; }
      body {
        display: grid;
        grid-template-columns: 248px minmax(0, 1fr);
        min-height: 100vh;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, sans-serif;
      }
      aside {
        display: flex;
        flex-direction: column;
        gap: 28px;
        padding: 26px 18px;
        background: var(--panel);
        border-right: 1px solid var(--border);
      }
      .brand { padding: 0 12px; color: var(--primary); font-size: 1.35rem; font-weight: 800; text-decoration: none; }
      .nav-label { margin: 0 12px 8px; color: var(--muted); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
      nav { display: grid; gap: 5px; }
      nav a, .sidebar-link {
        display: flex;
        align-items: center;
        gap: 11px;
        border-radius: 9px;
        padding: 11px 12px;
        color: var(--text);
        font-size: 0.93rem;
        font-weight: 600;
        text-decoration: none;
      }
      nav a:hover, nav a[aria-current="page"] { background: #edf3ff; color: var(--primary-dark); }
      .nav-icon {
        display: grid;
        width: 27px;
        height: 27px;
        flex: 0 0 27px;
        place-items: center;
        border-radius: 8px;
        background: #edf3ff;
        color: var(--primary-dark);
        font-size: 0.72rem;
        font-weight: 800;
      }
      .sidebar-bottom { margin-top: auto; }
      .account {
        overflow-wrap: anywhere;
        margin: 0 12px 10px;
        color: var(--muted);
        font-size: 0.86rem;
        line-height: 1.5;
      }
      .account strong { display: block; color: var(--text); font-size: 0.95rem; }
      button {
        width: 100%;
        border: 0;
        border-radius: 9px;
        padding: 11px 12px;
        background: #e9eef6;
        color: var(--text);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover { background: #dce4ef; }
      button:disabled { cursor: wait; opacity: 0.6; }
      main { width: min(1120px, calc(100% - 48px)); margin: 42px auto; }
      .eyebrow { margin: 0 0 8px; color: var(--primary-dark); font-size: 0.8rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(1.8rem, 4vw, 2.45rem); }
      .intro { margin: 12px 0 30px; color: var(--muted); line-height: 1.55; }
      h2 { margin: 0 0 15px; font-size: 1.1rem; }
      .module-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(245px, 1fr)); gap: 16px; }
      .module-card {
        display: flex;
        min-height: 205px;
        flex-direction: column;
        align-items: flex-start;
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 20px;
        background: var(--panel);
        box-shadow: 0 8px 24px rgba(31, 41, 55, 0.04);
        color: inherit;
        text-decoration: none;
      }
      .module-card:hover { border-color: #9db9f5; box-shadow: 0 12px 28px rgba(47, 111, 237, 0.1); transform: translateY(-2px); }
      .module-card:focus-visible, nav a:focus-visible, button:focus-visible { outline: 3px solid rgba(47, 111, 237, 0.35); outline-offset: 2px; }
      .module-icon {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border-radius: 12px;
        background: #edf3ff;
        color: var(--primary-dark);
        font-size: 0.85rem;
        font-weight: 800;
      }
      .module-card h3 { margin: 17px 0 7px; font-size: 1.08rem; }
      .module-card p { margin: 0; color: var(--muted); font-size: 0.9rem; line-height: 1.45; }
      .module-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 15px; }
      .action-chip { border-radius: 999px; padding: 5px 8px; background: #f0f3f8; color: #46556b; font-size: 0.72rem; font-weight: 700; }
      .empty-state, .status {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 18px;
        background: var(--panel);
        color: var(--muted);
        line-height: 1.5;
      }
      .status { display: none; margin-bottom: 18px; border-color: #f2c7c3; background: #fff0ef; color: var(--danger); }
      .status.visible { display: block; }
      [hidden] { display: none !important; }
      @media (max-width: 720px) {
        body { grid-template-columns: 1fr; }
        aside { gap: 14px; padding: 15px 16px; border-right: 0; border-bottom: 1px solid var(--border); }
        .brand { padding: 0 4px; }
        .nav-label { display: none; }
        nav { display: flex; overflow-x: auto; }
        nav a { flex: 0 0 auto; padding: 8px; }
        .nav-icon { display: none; }
        .sidebar-bottom { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .account { margin: 0; }
        .sidebar-bottom button { width: auto; }
        main { width: min(100% - 32px, 1120px); margin: 28px auto; }
      }
    </style>
  </head>
  <body>
    <aside aria-label="Main navigation">
      <a class="brand" href="/">InfoMan</a>
      <div>
        <p class="nav-label">Workspace</p>
        <nav id="moduleNavigation" aria-label="Modules">
          <a href="/" aria-current="page"><span class="nav-icon">H</span>Dashboard</a>
        </nav>
      </div>
      <div class="sidebar-bottom">
        <p id="accountInfo" class="account">Loading account…</p>
        <button id="logoutButton" type="button">Log out</button>
      </div>
    </aside>

    <main>
      <p class="eyebrow">Workspace</p>
      <h1 id="welcomeHeading">Welcome</h1>
      <p class="intro">Open a module available to your account. Access is based on your role and assigned rights.</p>
      <div id="loadStatus" class="status" role="alert"></div>
      <section aria-labelledby="modulesHeading">
        <h2 id="modulesHeading">Your modules</h2>
        <div id="moduleGrid" class="module-grid" aria-live="polite"></div>
        <p id="emptyState" class="empty-state" hidden>No modules are assigned to your account yet. Contact your administrator if you need access.</p>
      </section>
    </main>

    <script>
      const navigation = document.getElementById('moduleNavigation');
      const moduleGrid = document.getElementById('moduleGrid');
      const emptyState = document.getElementById('emptyState');
      const loadStatus = document.getElementById('loadStatus');
      const accountInfo = document.getElementById('accountInfo');

      function addModuleLink(container, module, isCard) {
        const link = document.createElement('a');
        link.href = module.href;
        if (isCard) {
          link.className = 'module-card';
          const icon = document.createElement('span');
          icon.className = 'module-icon';
          icon.setAttribute('aria-hidden', 'true');
          icon.textContent = module.label.split(/\s+/).map((word) => word[0]).join('').slice(0, 2).toUpperCase();
          const title = document.createElement('h3');
          title.textContent = module.label;
          const description = document.createElement('p');
          description.textContent = module.description;
          const actions = document.createElement('span');
          actions.className = 'module-meta';
          for (const action of module.actions) {
            const chip = document.createElement('span');
            chip.className = 'action-chip';
            chip.textContent = action;
            actions.append(chip);
          }
          link.append(icon, title, description, actions);
        } else {
          const icon = document.createElement('span');
          icon.className = 'nav-icon';
          icon.setAttribute('aria-hidden', 'true');
          icon.textContent = module.label[0].toUpperCase();
          link.append(icon, document.createTextNode(module.label));
        }
        container.append(link);
      }

      async function loadDashboard() {
        const response = await fetch('/api/dashboard/modules');
        if (response.status === 401) {
          window.location.assign('/login');
          return;
        }
        const result = await response.json();
        if (!response.ok) {
          throw new Error(result.message || 'Unable to load your modules.');
        }

        document.getElementById('welcomeHeading').textContent = `Welcome, ${result.user.name}`;
        accountInfo.replaceChildren();
        const name = document.createElement('strong');
        name.textContent = result.user.name;
        accountInfo.append(name, document.createTextNode(result.user.role));
        for (const module of result.modules) {
          addModuleLink(navigation, module, false);
          addModuleLink(moduleGrid, module, true);
        }
        emptyState.hidden = result.modules.length > 0;
      }

      document.getElementById('logoutButton').addEventListener('click', async (event) => {
        const button = event.currentTarget;
        button.disabled = true;
        try {
          const response = await fetch('/api/auth/logout', { method: 'POST' });
          const result = await response.json();
          if (!response.ok) {
            throw new Error(result.message || 'Unable to log out.');
          }
          window.location.assign('/login');
        } catch (error) {
          loadStatus.textContent = error.message;
          loadStatus.classList.add('visible');
          button.disabled = false;
        }
      });

      loadDashboard().catch((error) => {
        loadStatus.textContent = error.message;
        loadStatus.classList.add('visible');
      });
    </script>
  </body>
</html>
