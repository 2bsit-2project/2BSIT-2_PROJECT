<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products | Hope, Inc. ERP</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #b7c3d2;
        --sidebar: #0e1d2c;
        --panel: #ffffff;
        --primary: #3158e8;
        --text: #17263f;
        --muted: #64748b;
        --border: #e2e8f0;
        --danger: #b42318;
      }
      * { box-sizing: border-box; }
      body {
        display: grid;
        grid-template-columns: 248px minmax(0, 1fr);
        min-height: 100vh;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      aside {
        display: flex;
        position: sticky;
        top: 0;
        height: 100vh;
        flex-direction: column;
        gap: 24px;
        padding: 25px 19px 18px;
        background: var(--sidebar);
        color: #e8eef8;
      }
      .brand { display: flex; align-items: center; gap: 10px; color: #f2f6fc; font-size: 0.9rem; font-weight: 600; text-decoration: none; }
      .brand-mark { display: grid; width: 31px; height: 31px; place-items: center; border-radius: 8px; background: #16bfd0; color: white; font-size: 1.05rem; font-weight: 800; }
      nav { display: grid; gap: 5px; }
      nav a { display: flex; min-height: 40px; align-items: center; gap: 10px; border-radius: 8px; padding: 8px 10px; color: #aeb9c8; font-size: 0.84rem; font-weight: 500; text-decoration: none; }
      nav a:hover { background: rgba(255,255,255,0.08); color: #fff; }
      nav a[aria-current="page"] { background: var(--primary); color: #fff; }
      .sidebar-bottom { display: flex; align-items: center; gap: 10px; margin-top: auto; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 14px; }
      .avatar { display: grid; width: 31px; height: 31px; flex: 0 0 31px; place-items: center; border-radius: 50%; background: #263648; color: #eaf0f8; font-size: 0.74rem; font-weight: 700; }
      .account { min-width: 0; flex: 1; margin: 0; color: #eff3f8; font-size: 0.75rem; line-height: 1.35; }
      .account span { display: block; color: #8492a5; font-size: 0.68rem; }
      .logout-button { border: 0; border-radius: 7px; padding: 7px; background: transparent; color: #96a4b7; font: inherit; font-size: 0.72rem; cursor: pointer; }
      .logout-button:hover { background: rgba(255,255,255,0.08); color: #fff; }
      main { width: min(100%, 1440px); min-width: 0; margin: 0 auto; padding: 28px clamp(20px, 3vw, 40px) 40px; }
      .page-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
      h1 { margin: 0; font-size: clamp(1.35rem, 2vw, 1.7rem); letter-spacing: -0.03em; }
      .subtitle { margin: 4px 0 0; color: #334155; font-size: 0.85rem; }
      .role-badge { border: 1px solid rgba(255,255,255,0.8); border-radius: 999px; padding: 7px 12px; background: rgba(255,255,255,0.85); color: #475569; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
      .stat-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 20px; }
      .stat-card { border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; background: var(--panel); box-shadow: 0 6px 16px rgba(34,49,72,0.04); }
      .stat-label { color: var(--muted); font-size: 0.74rem; font-weight: 600; }
      .stat-value { display: block; margin-top: 6px; font-size: 1.5rem; font-weight: 750; letter-spacing: -0.03em; }
      .panel { border: 1px solid var(--border); border-radius: 12px; background: var(--panel); box-shadow: 0 8px 20px rgba(34,49,72,0.05); overflow: hidden; }
      .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 16px 18px; border-bottom: 1px solid var(--border); background: #f8fafc; }
      .toolbar input, .toolbar select { height: 38px; border: 1px solid #cbd5e1; border-radius: 8px; padding: 0 12px; background: #fff; color: var(--text); font: inherit; font-size: 0.85rem; }
      .toolbar input { flex: 1 1 260px; }
      .toolbar button { height: 38px; border: 1px solid #cbd5e1; border-radius: 8px; padding: 0 14px; background: #fff; color: var(--text); font: inherit; font-size: 0.82rem; font-weight: 600; cursor: pointer; }
      .toolbar button:hover { background: #eff6ff; border-color: #93c5fd; color: var(--primary); }
      .table-wrap { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
      th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border); }
      th { background: #f8fafc; color: #475569; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
      tbody tr:hover { background: #f8fafc; }
      .code-cell { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 600; color: var(--primary); white-space: nowrap; }
      .pill { display: inline-block; border-radius: 999px; padding: 3px 10px; font-size: 0.72rem; font-weight: 700; }
      .pill-ea { background: #dbeafe; color: #1e40af; }
      .pill-pc { background: #ede9fe; color: #5b21b6; }
      .pill-other { background: #fef3c7; color: #92400e; }
      .pill-active { background: #dcfce7; color: #166534; }
      .pill-inactive { background: #fee2e2; color: #991b1b; }
      .state-box { padding: 28px 18px; text-align: center; color: var(--muted); font-size: 0.88rem; }
      .error-banner { display: none; margin: 14px 18px; border: 1px solid #fecaca; border-radius: 8px; padding: 10px 14px; background: #fef2f2; color: var(--danger); font-size: 0.84rem; }
      .error-banner.visible { display: block; }
      @media (max-width: 900px) { body { grid-template-columns: 1fr; } aside { position: static; height: auto; } .stat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    </style>
  </head>
  <body>
    <aside aria-label="Main navigation">
      <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">H</span><span>Hope, Inc. ERP</span></a>
      <nav id="sidebar-nav">
        <a href="/dashboard">Dashboard</a>
        <a href="/products" aria-current="page">Products</a>
      </nav>
      <div class="sidebar-bottom">
        <div class="avatar" id="user-avatar">U</div>
        <p class="account"><strong id="user-name">Loading...</strong><span id="user-email"></span></p>
        <button class="logout-button" id="logout-btn" type="button">Log out</button>
      </div>
    </aside>

    <main>
      <div class="page-heading">
        <div>
          <h1>Product Catalog</h1>
          <p class="subtitle">Search and filter Hope, Inc. products by code, description, unit, and status.</p>
        </div>
        <span class="role-badge" id="role-badge">Checking role...</span>
      </div>

      <section class="stat-grid" aria-label="Product summary">
        <div class="stat-card"><span class="stat-label">Matching Products</span><span class="stat-value" id="stat-total">0</span></div>
        <div class="stat-card"><span class="stat-label">Each (ea)</span><span class="stat-value" id="stat-ea">0</span></div>
        <div class="stat-card"><span class="stat-label">Piece (pc)</span><span class="stat-value" id="stat-pc">0</span></div>
        <div class="stat-card"><span class="stat-label">Other Units</span><span class="stat-value" id="stat-other">0</span></div>
      </section>

      <section class="panel" aria-label="Product list">
        <div class="toolbar">
          <input id="search-input" type="search" placeholder="Search by product code or description..." aria-label="Search products" />
          <select id="unit-filter" aria-label="Filter by unit">
            <option value="">All units</option>
            <option value="ea">Each (ea)</option>
            <option value="pc">Piece (pc)</option>
            <option value="mtr">Meter (mtr)</option>
            <option value="pkg">Package (pkg)</option>
            <option value="ltr">Liter (ltr)</option>
          </select>
          <select id="status-filter" aria-label="Filter by status">
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
            <option value="All">All statuses</option>
          </select>
          <button id="clear-filters" type="button">Reset</button>
        </div>

        <div class="error-banner" id="error-banner" role="alert"></div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Product Code</th>
                <th>Description</th>
                <th>Unit</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="products-tbody">
              <tr><td colspan="4" class="state-box">Loading products...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script>
      const searchInput = document.getElementById('search-input');
      const unitFilter = document.getElementById('unit-filter');
      const statusFilter = document.getElementById('status-filter');
      const clearBtn = document.getElementById('clear-filters');
      const tbody = document.getElementById('products-tbody');
      const errorBanner = document.getElementById('error-banner');
      let searchTimer = null;

      function escapeHtml(text) {
        return String(text ?? '')
          .replace(/&/g, '&amp;').replace(/</g, '&lt;')
          .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      async function loadNavigation() {
        const resp = await fetch('/api/dashboard/modules');
        if (resp.status === 401) { window.location.href = '/login'; return; }
        if (!resp.ok) return;
        const { user, modules } = await resp.json();
        document.getElementById('user-name').textContent = user.name || 'User';
        document.getElementById('user-email').textContent = user.email || '';
        document.getElementById('user-avatar').textContent = (user.name || 'U').trim().charAt(0).toUpperCase();
        document.getElementById('role-badge').textContent = (user.role || 'user').toUpperCase();
        const nav = document.getElementById('sidebar-nav');
        nav.innerHTML = '<a href="/dashboard">Dashboard</a>' + modules.map((m) =>
          `<a href="${escapeHtml(m.href)}"${m.id === 'products' ? ' aria-current="page"' : ''}>${escapeHtml(m.label)}</a>`
        ).join('');
      }

      async function loadProducts() {
        errorBanner.classList.remove('visible');
        const params = new URLSearchParams();
        if (searchInput.value.trim()) params.set('search', searchInput.value.trim());
        if (unitFilter.value) params.set('unit', unitFilter.value);
        if (statusFilter.value) params.set('status', statusFilter.value);
        try {
          const resp = await fetch(`/api/products?${params.toString()}`);
          if (resp.status === 401) { window.location.href = '/login'; return; }
          const data = await resp.json();
          if (!resp.ok) {
            errorBanner.textContent = data.message || 'Unable to load products.';
            errorBanner.classList.add('visible');
            tbody.innerHTML = '<tr><td colspan="4" class="state-box">Access denied or error loading products.</td></tr>';
            return;
          }
          const rows = data.products || [];
          document.getElementById('stat-total').textContent = rows.length;
          document.getElementById('stat-ea').textContent = rows.filter((p) => p.unit === 'ea').length;
          document.getElementById('stat-pc').textContent = rows.filter((p) => p.unit === 'pc').length;
          document.getElementById('stat-other').textContent = rows.filter((p) => p.unit !== 'ea' && p.unit !== 'pc').length;
          if (!rows.length) {
            tbody.innerHTML = '<tr><td colspan="4" class="state-box">No products match your current search and filter criteria.</td></tr>';
            return;
          }
          tbody.innerHTML = rows.map((p) => {
            const unitCls = p.unit === 'ea' ? 'pill-ea' : p.unit === 'pc' ? 'pill-pc' : 'pill-other';
            const statusCls = String(p.status).toLowerCase() === 'inactive' ? 'pill-inactive' : 'pill-active';
            return `<tr>
              <td class="code-cell">${escapeHtml(p.prodcode)}</td>
              <td>${escapeHtml(p.description)}</td>
              <td><span class="pill ${unitCls}">${escapeHtml(p.unit)}</span></td>
              <td><span class="pill ${statusCls}">${escapeHtml(p.status)}</span></td>
            </tr>`;
          }).join('');
        } catch (err) {
          errorBanner.textContent = 'Network error while fetching products.';
          errorBanner.classList.add('visible');
        }
      }

      searchInput.addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(loadProducts, 180); });
      unitFilter.addEventListener('change', loadProducts);
      statusFilter.addEventListener('change', loadProducts);
      clearBtn.addEventListener('click', () => { searchInput.value = ''; unitFilter.value = ''; statusFilter.value = 'Active'; loadProducts(); });
      document.getElementById('logout-btn').addEventListener('click', async () => {
        await fetch('/api/auth/logout', { method: 'POST' });
        window.location.href = '/login';
      });
      loadNavigation();
      loadProducts();
    </script>
  </body>
</html>
