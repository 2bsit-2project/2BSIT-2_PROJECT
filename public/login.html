<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in</title>
    <style>
      :root {
        color-scheme: light;
        --panel: #ffffff;
        --primary: #2f6fed;
        --primary-dark: #1a4ec2;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #d9e1ef;
        --success: #0a8f5b;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #eef4ff, #f9fbff);
        font-family: Arial, sans-serif;
        color: var(--text);
      }

      .card {
        width: min(100%, 480px);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 14px 38px rgba(31, 41, 55, 0.08);
        padding: 32px;
      }

      h1 { margin-top: 0; margin-bottom: 8px; font-size: 2rem; }
      p { margin-top: 0; color: var(--muted); }
      form { display: flex; flex-direction: column; gap: 16px; }
      label { display: flex; flex-direction: column; gap: 8px; font-weight: 600; }
      input { padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 1rem; }
      input:focus { outline: 2px solid rgba(47, 111, 237, 0.14); border-color: var(--primary); }
      button {
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 10px;
        padding: 12px 16px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover { background: var(--primary-dark); }
      .status { display: none; margin-top: 16px; padding: 10px 12px; border-radius: 8px; font-weight: 600; }
      .status.success { display: block; background: rgba(10, 143, 91, 0.08); color: var(--success); }
      .status.error { display: block; background: rgba(220, 38, 38, 0.08); color: #b91c1c; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Log in</h1>
      <p>Sign in to your InfoMan account.</p>

      <form id="loginForm">
        <label>
          Email
          <input type="email" name="email" autocomplete="username" required />
        </label>

        <label>
          Password
          <input type="password" name="password" autocomplete="current-password" required />
        </label>

        <button type="submit">Log in</button>
      </form>

      <button id="logoutButton" type="button" hidden>Log out</button>
      <div id="formStatus" class="status" aria-live="polite"></div>
      <p>Need an account? <a href="/register">Register</a>.</p>
    </main>

    <script>
      const form = document.getElementById('loginForm');
      const logoutButton = document.getElementById('logoutButton');
      const statusBox = document.getElementById('formStatus');

      function showStatus(message, type) {
        statusBox.className = `status ${type}`;
        statusBox.textContent = message;
      }

      async function refreshSession() {
        const response = await fetch('/api/auth/session');
        if (response.ok) {
          const result = await response.json();
          form.hidden = true;
          logoutButton.hidden = false;
          showStatus(`Logged in as ${result.user.name}.`, 'success');
          return;
        }

        form.hidden = false;
        logoutButton.hidden = true;
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        statusBox.className = 'status';
        statusBox.textContent = '';

        try {
          const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(Object.fromEntries(new FormData(form).entries()))
          });
          const result = await response.json();
          if (!response.ok) {
            throw new Error(result.message || 'Unable to log in.');
          }

          form.reset();
          await refreshSession();
        } catch (error) {
          showStatus(error.message, 'error');
        }
      });

      logoutButton.addEventListener('click', async () => {
        try {
          const response = await fetch('/api/auth/logout', { method: 'POST' });
          const result = await response.json();
          if (!response.ok) {
            throw new Error(result.message || 'Unable to log out.');
          }

          await refreshSession();
          showStatus(result.message, 'success');
        } catch (error) {
          showStatus(error.message, 'error');
        }
      });

      refreshSession().catch(() => showStatus('Unable to check login status.', 'error'));
    </script>
  </body>
</html>
